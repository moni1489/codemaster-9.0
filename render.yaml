# Render Blueprint: Dashboard → New → Blueprint → выбрать репозиторий.
services:
  - type: web
    name: vko-archive
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vko-archive-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false        # задать вручную в Dashboard: пароль всех демо-учёток
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: LLM_PROVIDER
        value: auto
      - key: OPENROUTER_API_KEY
        sync: false        # необязательно: ключ OpenRouter
      - key: GROQ_API_KEY
        sync: false        # необязательно: распознавание голоса (Groq Whisper)
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: LLM_TIMEOUT_SECONDS
        value: "45"
      - key: SITE_URL
        value: https://vko-archive.onrender.com

databases:
  - name: vko-archive-db
    plan: free
    region: frankfurt
    databaseName: archive
    user: archive
