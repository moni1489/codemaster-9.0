# Пинг сайта на Render каждые 10 минут, чтобы бесплатный инстанс не засыпал
# (на free-плане сервис засыпает после 15 минут без запросов, а при пробуждении временный диск очищается).
# Адрес берётся из переменной репозитория SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then echo "SITE_URL не задан"; exit 0; fi
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 "$URL/api/health"
